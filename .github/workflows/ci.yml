name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (RuboCop + RSpec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: Set up test database
        run: bin/rails db:create db:migrate

      - name: RuboCop
        run: bin/rubocop

      - name: RSpec
        run: bundle exec rspec

  frontend-lint-and-unit:
    name: Frontend (ESLint + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # bookmarklet.js bakes this in at build time as its /ingest POST
      # target (see vite.bookmarklet.config.ts, which now fails the build
      # loudly if it's unset) and verify-bookmarklet-build.mjs checks the
      # built artifact against it. A dummy value is fine here - CI never
      # actually hits this origin - the point is exercising the same
      # build/verify path a real deploy would use, not localhost's default.
      VITE_API_ORIGIN: https://api.example.test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify bookmarklet.js build output
        run: npm run verify:bookmarklet-build

  frontend-e2e:
    name: Frontend (Playwright e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

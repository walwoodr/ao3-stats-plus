<!--
  EXTERNAL-UNVERIFIED: see work-page-wip-open-ended.html's header comment -
  same markup-shape caveat applies here.

  This fixture: a finished work ("Completed:" dt present, chapters "10/10"),
  in no series (no dt.series/dd.series pair at all), with genuinely zero
  public bookmarks and zero visible comments. Verified against AO3's real
  work_meta_list helper (otwcode/otwarchive, app/helpers/works_helper.rb):
  `if (comment_count = work.count_visible_comments) > 0` and
  `if (bookmark_count = work.public_bookmarks_count) > 0` wrap the whole
  dt/dd pair for comments and bookmarks respectively - AO3 omits the row
  entirely when the count is zero, it does NOT render a bare "0". This
  fixture has neither dt.comments/dd.comments nor dt.bookmarks/dd.bookmarks
  at all, so the scraper must infer 0 from the row's absence (while other
  stats rows, e.g. dd.hits/dd.published, ARE present - distinguishing
  "this field is genuinely zero" from "the whole stats block is broken/
  missing", which is what work-page-malformed.html tests instead).
  Also verified: chapter_total_display (used for the Chapters row) never
  wraps its number in a link - only the Bookmarks row does (via link_to),
  and only when bookmark_count > 0.
-->
<div id="workskin">
  <div id="main" class="works-show region" role="main">
    <div class="wrapper">
      <div class="preface group">
        <h2 class="title heading">A Finished One-Shot</h2>
      </div>
      <dl class="work meta group">
        <dt class="fandom">Fandom:</dt>
        <dd class="fandom tags">
          <ul class="commas">
            <li><a class="tag" href="/tags/Fandom%20Two/works">Fandom Two</a></li>
          </ul>
        </dd>
        <dt class="stats">Stats:</dt>
        <dd class="stats">
          <dl class="stats">
            <dt>Published:</dt>
            <dd class="published">2022-01-10</dd>
            <dt>Completed:</dt>
            <dd class="status">2022-01-10</dd>
            <dt>Words:</dt>
            <dd class="words">5,000</dd>
            <dt>Chapters:</dt>
            <dd class="chapters">10/10</dd>
            <dt>Kudos:</dt>
            <dd class="kudos">5</dd>
            <dt>Hits:</dt>
            <dd class="hits">50</dd>
          </dl>
        </dd>
      </dl>
    </div>
  </div>
</div>

<!--
  EXTERNAL-UNVERIFIED: see work-page-wip-open-ended.html's header comment -
  same markup-shape caveat applies here, including the assumption that a
  work belonging to more than one series renders as multiple consecutive
  span.series elements inside dd.series (mirroring how dd.fandom.tags lists
  multiple li.tag entries for a multi-fandom work).

  This fixture: a work belonging to two different series.
-->
<div id="workskin">
  <div id="main" class="works-show region" role="main">
    <div class="wrapper">
      <div class="preface group">
        <h2 class="title heading">A Multi-Series Work</h2>
      </div>
      <dl class="work meta group">
        <dt class="fandom">Fandom:</dt>
        <dd class="fandom tags">
          <ul class="commas">
            <li><a class="tag" href="/tags/Fandom%20One/works">Fandom One</a></li>
          </ul>
        </dd>
        <dt class="series">Series:</dt>
        <dd class="series">
          <span class="series">
            Part <strong>1</strong> of <a href="/series/456">Series One</a>
          </span>
          <span class="series">
            Part <strong>3</strong> of <a href="/series/789">Series Two</a>
          </span>
        </dd>
        <dt class="stats">Stats:</dt>
        <dd class="stats">
          <dl class="stats">
            <dt>Published:</dt>
            <dd class="published">2024-02-14</dd>
            <dt>Updated:</dt>
            <dd class="status">2024-03-01</dd>
            <dt>Chapters:</dt>
            <dd class="chapters"><a href="/works/333/navigate">2</a>/5</dd>
            <dt>Comments:</dt>
            <dd class="comments"><a href="/works/333#comments">3</a></dd>
            <dt>Kudos:</dt>
            <dd class="kudos"><a href="/works/333#kudos">20</a></dd>
            <dt>Bookmarks:</dt>
            <dd class="bookmarks"><a href="/works/333/bookmarks">2</a></dd>
            <dt>Hits:</dt>
            <dd class="hits">200</dd>
          </dl>
        </dd>
      </dl>
    </div>
  </div>
</div>

<!--
  Series markup CONFIRMED against AO3's real series_helper.rb
  (show_series_data/series_data_for_work, otwcode/otwarchive): each series a
  work belongs to renders as its own <span class="series">, but the "Part N
  of <title link>" text is nested inside an INNER <span class="position">
  (plain text, no <strong> around the number - the original fixture/scraper
  had both of these wrong). Critically, span.series can ALSO contain sibling
  "Previous Work"/"Next Work" navigation links (<a class="previous">/
  <a class="next">) for any work that isn't first/last in that series - this
  fixture's second series (Series Two) exercises exactly that case, since a
  selector scoped to "span.series a" (not "span.position a") would
  incorrectly pick up "Previous Work"/"Next Work" as if they were series
  names for any real work in the middle of a series.

  The outer dl.work.meta.group/nested dl.stats shape and the individual
  dt/dd stats classes remain EXTERNAL-UNVERIFIED (see
  work-page-wip-open-ended.html's header) - only the series markup above is
  independently confirmed. Per the verified work_meta_list behavior (see
  work-page-complete-no-series.html's header), only the Bookmarks row is
  ever linked - Chapters, Comments, and Kudos are always plain text.

  This fixture: a work belonging to two different series - the sole work in
  Series One (no previous/next links), and the middle work of three in
  Series Two (both previous and next links present).
-->
<div id="workskin">
  <div id="main" class="works-show region" role="main">
    <div class="wrapper">
      <div class="preface group">
        <h2 class="title heading">A Multi-Series Work</h2>
      </div>
      <dl class="work meta group">
        <dt class="fandom">Fandom:</dt>
        <dd class="fandom tags">
          <ul class="commas">
            <li><a class="tag" href="/tags/Fandom%20One/works">Fandom One</a></li>
          </ul>
        </dd>
        <dt class="series">Series:</dt>
        <dd class="series">
          <span class="series">
            <span class="position">Part 1 of <a href="/series/456">Series One</a></span>
          </span>
          <span class="series">
            <a href="/works/330" class="previous">&#8592; Previous Work</a
            ><span class="divider"> </span
            ><span class="position">Part 2 of <a href="/series/789">Series Two</a></span
            ><span class="divider"> </span><a href="/works/336" class="next">Next Work &#8594;</a>
          </span>
        </dd>
        <dt class="stats">Stats:</dt>
        <dd class="stats">
          <dl class="stats">
            <dt>Published:</dt>
            <dd class="published">2024-02-14</dd>
            <dt>Updated:</dt>
            <dd class="status">2024-03-01</dd>
            <dt>Chapters:</dt>
            <dd class="chapters">2/5</dd>
            <dt>Comments:</dt>
            <dd class="comments">3</dd>
            <dt>Kudos:</dt>
            <dd class="kudos">20</dd>
            <dt>Bookmarks:</dt>
            <dd class="bookmarks"><a href="/works/333/bookmarks">2</a></dd>
            <dt>Hits:</dt>
            <dd class="hits">200</dd>
          </dl>
        </dd>
      </dl>
    </div>
  </div>
</div>

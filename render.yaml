# Render Blueprint (https://render.com/docs/infrastructure-as-code) for the
# finalized hosting plan (docs/plans/bookmarklet-entrypoint-and-hosting.md,
# Section 1): split topology - a Docker backend web service, a managed
# Postgres database, and a separate-origin Static Site for the frontend.
# Personal/single-user tool - deliberately not built for scale (see
# README.md's "Deployment (Render)" section and TECH_DEBT.md).
#
# Shape pinned by spec/deployment/render_yaml_spec.rb (T5). The frontend is
# a `services:` entry with `runtime: static`, same as any other service -
# Render's Blueprint schema has no separate top-level `staticSites:` key.
# (An earlier version of this file used `staticSites:`, matching an earlier
# version of the spec that assumed that key without verifying it against
# Render's live docs - Review caught that both shared the same wrong
# assumption. See TECH_DEBT.md.)
#
# fromService only exposes a service's private-network host/port, not its
# public https://*.onrender.com URL, so the two services' public origins
# can't be wired together via fromService. Both service names below are
# fixed/predictable instead, and each origin is hardcoded as a plain
# `value:` in the other service's envVars, since Render's public URL for a
# named service is always https://<name>.onrender.com.
databases:
  - name: ao3-stats-plus-db
    plan: basic-256mb
    # Render's Basic tier defaults to a 15GB disk (~$4.50/mo at $0.30/GB)
    # when diskSizeGB is left unset - far more than a personal stats
    # tracker needs (a few thousand snapshot rows over years is a few MB).
    # 1GB is the platform minimum (allowed values: 1, or multiples of 5)
    # and costs $0.30/mo instead. Bump this if real usage ever approaches
    # it - resizing up is supported; Render does not support shrinking a
    # disk back down later.
    diskSizeGB: 1

services:
  - type: web
    name: ao3-stats-plus-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /up
    preDeployCommand: bundle exec rails db:migrate
    # PORT binding: deliberately NOT overridden here (no PORT envVar, no
    # dockerCommand override of backend/Dockerfile's default CMD). Render's
    # `runtime: docker` services route external traffic to the port declared
    # by the Dockerfile's EXPOSE instruction (EXPOSE 80 here) rather than
    # requiring the app to bind to a platform-injected $PORT - unlike
    # Render's native/buildpack runtimes, which do require reading $PORT.
    # Inside the container, Thruster (backend/Dockerfile's CMD) already
    # listens on port 80 (its HTTP_PORT default) and proxies to Puma on port
    # 3000 (Thruster's TARGET_PORT default, matching config/puma.rb's own
    # `ENV.fetch("PORT", 3000)` default) - so EXPOSE 80 and the two
    # processes' defaults are already mutually consistent with no env vars
    # set. A stray PORT envVar here wouldn't actually be harmful - Thruster
    # sets PORT itself when it starts Puma (per Thruster's own README:
    # TARGET_PORT "is the port your Puma server should run on... Thruster
    # will set PORT to this value when starting Puma"), overriding whatever
    # PORT was in the environment - so Puma would stay on 3000 regardless.
    # It's simply unnecessary, not dangerous. See I7 in the implementation
    # task list.
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ao3-stats-plus-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://ao3-stats-plus.onrender.com

  - type: web
    name: ao3-stats-plus
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_ORIGIN
        value: https://ao3-stats-plus-api.onrender.com
      - key: VITE_GRAPHQL_URL
        value: https://ao3-stats-plus-api.onrender.com/graphql
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
